<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Puter Account Pool Manager</title>
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="description" content="Free AI API with no limits — pool your Puter accounts and route requests across 400+ models automatically." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5555619941305353" crossorigin="anonymous"></script>
    <script async src="https://fundingchoicesmessages.google.com/i/pub-5555619941305353?ers=1"></script>
    <script src="https://js.puter.com/v2/"></script>
    <style>
      :root {
        --background: 240 10% 3.9%;
        --foreground: 0 0% 98%;
        --card: 240 10% 3.9%;
        --card-foreground: 0 0% 98%;
        --primary: 239 84% 67%;
        --primary-foreground: 0 0% 100%;
        --secondary: 240 3.7% 15.9%;
        --secondary-foreground: 0 0% 98%;
        --muted: 240 3.7% 15.9%;
        --muted-foreground: 240 5% 64.9%;
        --accent: 240 3.7% 15.9%;
        --destructive: 0 62.8% 30.6%;
        --destructive-foreground: 0 0% 98%;
        --border: 240 3.7% 15.9%;
        --input: 240 3.7% 15.9%;
        --ring: 239 84% 67%;
        --radius: 0.5rem;
        --chart-grid: hsl(0 0% 100% / 0.04);
        --chart-tooltip-bg: hsl(240 10% 3.9%);
        --scroll-thumb: rgba(255, 255, 255, 0.08);
        --scroll-thumb-hover: rgba(255, 255, 255, 0.15);
      }
      :root[data-theme="light"] {
        --background: 0 0% 100%;
        --foreground: 240 10% 3.9%;
        --card: 0 0% 100%;
        --card-foreground: 240 10% 3.9%;
        --primary: 239 84% 67%;
        --primary-foreground: 0 0% 100%;
        --secondary: 240 4.8% 95.9%;
        --secondary-foreground: 240 5.9% 10%;
        --muted: 240 4.8% 95.9%;
        --muted-foreground: 240 3.8% 46.1%;
        --accent: 240 4.8% 95.9%;
        --destructive: 0 84.2% 60.2%;
        --destructive-foreground: 0 0% 98%;
        --border: 240 5.9% 90%;
        --input: 240 5.9% 90%;
        --ring: 239 84% 67%;
        --radius: 0.5rem;
        --chart-grid: rgba(0, 0, 0, 0.05);
        --chart-tooltip-bg: #ffffff;
        --scroll-thumb: rgba(0, 0, 0, 0.1);
        --scroll-thumb-hover: rgba(0, 0, 0, 0.2);
      }
      body {
        margin: 0;
        background-color: hsl(var(--background));
        color: hsl(var(--foreground));
        font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
        overflow-x: hidden;
        transition: background-color 0.3s, color 0.3s;
      }
      .ad-slot {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 90px;
        margin: 28px auto;
        overflow: hidden;
      }
      .ad-slot-square {
        min-height: 250px;
      }
      @media (max-width: 640px) {
        .github-btn-text {
          display: none;
        }
      }
      /* Custom modern scrollbars */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: var(--scroll-thumb);
        border-radius: 999px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--scroll-thumb-hover);
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.4; transform: scale(0.9); }
      }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
